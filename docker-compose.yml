##############################################################################
# YMSNOW — Docker Compose
#
# Usage:
#   cp .env.example .env        # fill in your secrets
#   docker compose up --build
#
# Services:
#   postgres   PostgreSQL 16 database
#   migrate    One-shot schema migration (drizzle-kit push), then exits
#   api        Express API server on internal port 8080
#   web        Nginx serving the React SPA + proxying /api  →  port 80
##############################################################################

services:

  # ── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-yms}
      POSTGRES_USER:     ${POSTGRES_USER:-yms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yms} -d ${POSTGRES_DB:-yms}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Schema migration (init container) ─────────────────────────────────────
  # Runs drizzle-kit push against the database, then exits.
  # The api service waits for this to complete successfully before starting.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yms}
    depends_on:
      postgres:
        condition: service_healthy

  # ── API server ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      PORT:         8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-yms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yms}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      NODE_ENV:     production
      # Optional — connect your OpenAI key to enable AI features.
      # Leave unset to run without AI (the app degrades gracefully).
      AI_INTEGRATIONS_OPENAI_API_KEY:  ${OPENAI_API_KEY:-}
      AI_INTEGRATIONS_OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Web / nginx ────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
