##############################################################################
# YMSNOW — Nginx configuration
# Serves the built React SPA and reverse-proxies /api to the API server.
##############################################################################

server {
    listen 80;
    server_name _;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    root /usr/share/nginx/html;
    index index.html;

    # ── Health check endpoint (used by Docker HEALTHCHECK) ──────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── API reverse proxy ────────────────────────────────────────────────────
    # All /api/* requests are forwarded to the API server container.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Allow larger payloads (email parsing, file uploads)
        client_max_body_size 20m;
        proxy_read_timeout   120s;
    }

    # ── Static assets: long-lived cache ─────────────────────────────────────
    # Vite fingerprints asset filenames with a content hash, so these are
    # safe to cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # Any path that doesn't match a real file is served as index.html so that
    # client-side routing (Wouter) works on hard refresh / direct navigation.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html must not be cached so users always get the latest shell.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        no-cache;
        add_header Expires       0;
    }
}
